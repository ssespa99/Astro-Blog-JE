name: Build and Deploy (Self-Hosted)

on:
  push:
    branches:
      - main # or master

jobs:
  deploy:
    runs-on: self-hosted # <--- Tells GitHub to run directly on your Ubuntu server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Site
        run: npm run build

      - name: Copy Files to Web Root
        run: |
          rsync -av --delete dist/ /var/www/lawyer-portfolio/